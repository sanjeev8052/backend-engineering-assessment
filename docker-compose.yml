version: '3.8'

services:
  gcs-emulator:
    image: fsouza/fake-gcs-server
    container_name: orders_gcs_emulator
    ports:
      - "4443:4443"
    entrypoint:
      - sh
      - -c
      - "mkdir -p /storage/orders-bucket && exec /bin/fake-gcs-server -scheme http -port 4443 -external-url http://localhost:4443"